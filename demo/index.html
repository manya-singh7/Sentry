<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sentry: guided device troubleshooting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
/* Color is information. Base is neutral; green/amber/red appear ONLY as action category. */
:root{
  --base:#0B1013; --panel:#111A1F; --raised:#17232A; --line:#233139; --line2:#1B2830;
  --text:#E8EEF0; --muted:#8BA0A8; --dim:#5F747C;
  --ink:#DDE8EB;                 /* neutral highlight: buttons, confidence, focus */
  --auto:#4FD08A; --manual:#F0B341; --critical:#FF5D4D;
  --auto-bg:rgba(79,208,138,.09); --manual-bg:rgba(240,179,65,.09); --critical-bg:rgba(255,93,77,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Instrument Sans',system-ui,sans-serif;background:var(--base);color:var(--text);
  min-height:100vh;display:flex;justify-content:center;padding:44px 18px 72px;font-variant-numeric:tabular-nums}
.wrap{width:100%;max-width:720px;display:flex;flex-direction:column;gap:18px}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* Header */
.brand{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.brand svg{width:34px;height:34px;flex:none}
h1{font-family:'Fraunces',serif;font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1}
.sub{color:var(--muted);font-size:15px;line-height:1.55;max-width:52ch;padding-bottom:6px}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted);padding:12px 0 2px;border-top:1px solid var(--line2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:2px;display:block}

/* Panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
.samples{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:14px;font-size:13px;color:var(--dim)}
.pill,.chip{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 13px;
  font:500 13px 'Instrument Sans',sans-serif;cursor:pointer;transition:color .15s,border-color .15s}
.pill:hover,.chip:hover{color:var(--text);border-color:var(--muted)}
textarea,.text-input{width:100%;background:var(--base);border:1px solid var(--line);border-radius:10px;padding:13px 15px;
  color:var(--text);font:400 15px/1.5 'Instrument Sans',sans-serif;outline:none;transition:border-color .15s}
textarea{resize:vertical;min-height:88px}
textarea::placeholder,.text-input::placeholder{color:var(--dim)}
textarea:focus,.text-input:focus{border-color:var(--ink)}
.input-group{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:9px;
  padding:11px 16px;font:600 14px 'Instrument Sans',sans-serif;cursor:pointer;transition:background .15s,border-color .15s}
button svg{width:16px;height:16px}
.btn-primary{background:var(--ink);color:#0B1013;flex:1;min-width:160px}
.btn-primary:hover:not(:disabled){background:#fff}
.btn-secondary{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn-secondary:hover:not(:disabled){border-color:var(--muted)}
.btn-mic.recording{border-color:var(--critical);color:var(--critical)}
button:disabled{opacity:.45;cursor:not-allowed}
.hint,.status{font-size:13px;color:var(--muted);min-height:16px}
.preview{display:none;align-items:center;gap:12px;padding:10px;background:var(--base);border:1px dashed var(--line);border-radius:10px}
.preview img{width:50px;height:50px;object-fit:cover;border-radius:6px}
.preview .name{flex:1;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-x{background:transparent;color:var(--muted);padding:4px 8px;font-size:13px}

/* Loading */
.loading{display:none;flex-direction:column;align-items:center;gap:12px;padding:34px 16px;text-align:center}
.spinner{width:24px;height:24px;border:2px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{font-weight:600;transition:opacity .2s}
.loading-timer{font-size:13px;color:var(--dim)}

/* Run summary strip: neutral, so signal colors stay meaningful */
.run{display:none;flex-wrap:wrap;gap:8px 22px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:13px;color:var(--muted)}
.run b{color:var(--text);font-weight:600;margin-left:5px}
#metaCacheNote{margin-left:10px}
.hint:empty,.status:empty{display:none}
.tag{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;padding:2px 9px;font-size:12px;font-weight:600;color:var(--muted)}
.tag.on{color:var(--text);border-color:var(--muted)}
.caption{font-size:12.5px;color:var(--dim);line-height:1.5}
.framing{display:none;flex-direction:column;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:13.5px}
.framing small{font-size:12px;color:var(--dim)}
.framing .raw{color:var(--muted)} .framing .arrow{color:var(--dim);margin:0 6px} .framing .clean{font-weight:600}

/* Clarify */
.results{display:flex;flex-direction:column;gap:16px}
.clarify{background:var(--panel);border:1px solid var(--ink);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:13px}
.clarify h3{font-size:17px;line-height:1.4}
.clarify small{color:var(--muted);font-size:13px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.free{display:flex;gap:8px}.free .text-input{flex:1;padding:9px 12px}
.btn-link{background:none;color:var(--dim);font-size:13px;padding:2px;align-self:flex-start}
.btn-link:hover{color:var(--text);text-decoration:underline}
.refined{border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;color:var(--text)}

/* Hypothesis */
.goal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:16px}
.goal-head{display:flex;align-items:center;gap:20px;padding-bottom:16px;border-bottom:1px solid var(--line2)}
.area{font-size:13px;color:var(--muted);margin-bottom:4px}
.goal-title{font-family:'Fraunces',serif;font-size:23px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.goal-text{font-size:14px;color:var(--muted);line-height:1.5;margin-top:6px}
.gauge{position:relative;width:100px;height:100px;flex:none}
.gauge svg{width:100%;height:100%;display:block}
.tick{stroke:var(--line);stroke-width:3;stroke-linecap:round}
.tick.on{stroke:var(--ink);animation:light .3s both;animation-delay:calc(var(--i)*30ms)}
@keyframes light{from{stroke:var(--line)}to{stroke:var(--ink)}}
.gauge-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.gauge-num b{font-size:28px;font-weight:800}
.gauge-num span{font-size:10px;color:var(--muted);margin-top:3px}
.verified{font-size:13px;color:var(--muted)}
.trace{background:var(--base);border:1px solid var(--line2);border-radius:10px}
.trace summary{padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:600;font-size:13.5px}
.trace summary:hover{color:var(--text)}
.trace ul{list-style:none;padding:4px 14px 12px;display:flex;flex-direction:column;gap:7px}
.trace li{font-size:13px;color:var(--muted);line-height:1.5;padding-left:12px;border-left:2px solid var(--line)}

/* Actions: the color-coded signal */
.actions{display:flex;flex-direction:column;gap:12px}
.action{--c:var(--manual);--bg:var(--manual-bg);background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--c);
  border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.action.cat-auto{--c:var(--auto);--bg:var(--auto-bg)}
.action.cat-critical{--c:var(--critical);--bg:var(--critical-bg)}
.act-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.act-name{font-size:16px;font-weight:700}
.kind{font-size:13px;font-weight:600;color:var(--c)}
.act-desc{font-size:14px;color:var(--muted)}
.steps{margin-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--text);line-height:1.5}
.steps li::marker{color:var(--c);font-weight:600}
.deeplink{align-self:flex-start;background:transparent;color:var(--c);border:1px solid var(--c);padding:8px 13px;font-size:13.5px}
.deeplink:hover{background:var(--bg)}
.deeplink small{color:var(--dim);font-weight:400;font-size:12px}

.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty h3{color:var(--text);font-size:16px;margin-bottom:6px}
.empty p{font-size:14px;line-height:1.6}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--raised);border:1px solid var(--line);
  padding:10px 18px;border-radius:9px;font-size:14px;transition:transform .25s;z-index:100;pointer-events:none;opacity:0}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media(max-width:520px){.gauge{width:76px;height:76px}.gauge-num b{font-size:23px}h1{font-size:32px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 3l11 4v8c0 7-4.7 11.6-11 14C9.700 26.600 5 22 5 15V7l11-4z" stroke="#DDE8EB" stroke-width="2" stroke-linejoin="round"/><path d="M11 16.500l3.500 3.500L21 12.500" stroke="#4FD08A" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h1>Sentry</h1>
    </div>
    <p class="sub">Describe a device fault by text, voice, or photo. Sentry checks it against a live troubleshooting catalog and returns a ranked repair plan.</p>
    <div class="legend" aria-label="Color key">
      <span><i style="background:var(--auto)"></i>Safe settings change</span>
      <span><i style="background:var(--manual)"></i>Needs your hands</span>
      <span><i style="background:var(--critical)"></i>Restart or reset</span>
    </div>
  </header>

  <div class="panel">
    <div class="samples">
      <span>Try:</span>
      <button type="button" class="pill" data-query="The mobile phone swipe navigation moves up or down instead of left or right after downloading an app">Swipe inverted</button>
      <button type="button" class="pill" data-query="Battery draining extremely fast since the latest software update">Battery drain</button>
      <button type="button" class="pill" data-query="Camera app crashes every time I try to switch to ultra wide lens">Camera crash</button>
      <button type="button" class="pill" data-query="Phone charges very slowly and the charging port looks dirty">Dirty charging port</button>
      <button type="button" class="pill" data-query="Screen keeps flickering">Screen flickering</button>
    </div>
    <div class="input-group">
      <textarea id="queryInput" placeholder="Describe the problem, for example: screen flickers when brightness is low. You can attach a photo too."></textarea>
      <input type="file" id="imageInput" accept="image/*" hidden>
      <div class="preview" id="preview"><img id="previewImg" alt="Attached photo"><div class="name" id="previewName"></div><button type="button" class="btn-x" id="btnRemoveImg">Remove</button></div>
      <div class="row">
        <button type="button" class="btn-secondary" id="btnUploadPhoto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.500"/></svg>Add photo</button>
        <button type="button" class="btn-secondary btn-mic" id="btnMic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg><span id="micLabel">Speak</span></button>
        <button type="button" class="btn-primary" id="btnSubmit">Diagnose</button>
      </div>
      <div class="hint" id="comboHint"></div>
      <div class="status" id="statusMsg"></div>
    </div>
  </div>

  <div class="panel loading" id="loadingBox">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText"></div>
    <div class="loading-timer" id="loadingTimer">0.0 s</div>
  </div>

  <div class="run" id="telemetryBar">
    <span>Time<b id="metaLatency">-</b></span>
    <span>Cache<b id="metaCache">-</b><span id="metaCacheNote"></span></span>
    <span>Model<b id="metaModel">-</b></span>
    <span>Cost<b id="metaCost">-</b></span>
    <span id="sourceBadgeWrap"></span><span id="clarifyBadgeWrap"></span>
  </div>
  <div class="caption" id="badgeCaption" style="display:none"></div>
  <div class="framing" id="queryFraming"></div>
  <div class="results" id="resultsContainer"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const BACKEND_BASE = "http://localhost:8000";
const $ = id => document.getElementById(id);
const queryInput=$("queryInput"), imageInput=$("imageInput"), btnMic=$("btnMic"), btnSubmit=$("btnSubmit"),
  statusMsg=$("statusMsg"), comboHint=$("comboHint"), loadingBox=$("loadingBox"), loadingText=$("loadingText"),
  loadingTimer=$("loadingTimer"), telemetryBar=$("telemetryBar"), resultsContainer=$("resultsContainer"), toast=$("toast"),
  sourceBadgeWrap=$("sourceBadgeWrap"), clarifyBadgeWrap=$("clarifyBadgeWrap");
let selectedImageFile=null, timerInterval=null, stageInterval=null, recognition=null, isRecording=false, lastQuery="", lastRawText="";

const esc = s => s ? String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;") : "";
function showToast(m){ toast.textContent=m; toast.classList.add("show"); setTimeout(()=>toast.classList.remove("show"),3000); }
function setStatus(t,err=false){ statusMsg.textContent=t; statusMsg.style.color=err?"var(--critical)":"var(--muted)"; }
function updateHint(){
  const t=queryInput.value.trim().length>0;
  comboHint.textContent=(selectedImageFile&&t)?"Sentry will read the photo and your description together.":selectedImageFile?"A short description alongside the photo makes the diagnosis more accurate.":"";
}
queryInput.addEventListener("input",updateHint);
document.querySelectorAll(".pill").forEach(p=>p.addEventListener("click",()=>{ queryInput.value=p.dataset.query; clearImage(); setStatus("Example loaded. Select Diagnose to run it."); }));

// Voice
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){
  recognition=new SR(); recognition.continuous=false; recognition.interimResults=true; recognition.lang="en-US";
  const idle=()=>{ isRecording=false; btnMic.classList.remove("recording"); $("micLabel").textContent="Speak"; };
  recognition.onstart=()=>{ isRecording=true; btnMic.classList.add("recording"); $("micLabel").textContent="Listening"; setStatus("Listening. Speak into your microphone."); };
  recognition.onresult=e=>{ let t=""; for(let i=e.resultIndex;i<e.results.length;i++) t+=e.results[i][0].transcript; queryInput.value=t; updateHint(); };
  recognition.onerror=e=>{ idle(); setStatus(`Voice input failed (${e.error}). Try again or type the problem.`,true); };
  recognition.onend=()=>{ idle(); setStatus(queryInput.value.trim()?"Got it. Review the text, then select Diagnose.":""); };
  btnMic.addEventListener("click",()=>{ if(isRecording) recognition.stop(); else { try{recognition.start();}catch(e){console.error(e);} } });
} else btnMic.addEventListener("click",()=>alert("Voice input needs Chrome or Edge."));

// Photo
$("btnUploadPhoto").addEventListener("click",()=>imageInput.click());
imageInput.addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  selectedImageFile=f; $("previewName").textContent=`${f.name} (${(f.size/1024).toFixed(1)} KB)`;
  const r=new FileReader(); r.onload=ev=>{ $("previewImg").src=ev.target.result; $("preview").style.display="flex"; }; r.readAsDataURL(f);
  setStatus("Photo attached."); updateHint();
});
$("btnRemoveImg").addEventListener("click",clearImage);
function clearImage(){ selectedImageFile=null; imageInput.value=""; $("previewImg").src=""; $("preview").style.display="none"; updateHint(); }

// Loading
const STAGES_TEXT=["Reading your description","Searching the troubleshooting catalog","Ranking likely causes","Double-checking each plan"];
const STAGES_IMAGE=["Reading the photo","Reading your description","Searching the troubleshooting catalog","Ranking likely causes"];
function showLoading(stages){
  loadingBox.style.display="flex"; resultsContainer.innerHTML=""; telemetryBar.style.display="none"; btnSubmit.disabled=true;
  clarifyBadgeWrap.innerHTML=""; $("badgeCaption").style.display="none"; $("queryFraming").style.display="none";
  const m=stages||STAGES_TEXT; let i=0; loadingText.style.opacity="1"; loadingText.textContent=m[0];
  clearInterval(stageInterval);
  stageInterval=setInterval(()=>{ i=Math.min(i+1,m.length-1); loadingText.style.opacity="0"; setTimeout(()=>{loadingText.textContent=m[i];loadingText.style.opacity="1";},180); },1400);
  const start=performance.now(); clearInterval(timerInterval);
  timerInterval=setInterval(()=>{ loadingTimer.textContent=`${((performance.now()-start)/1000).toFixed(1)} s`; },100);
}
function hideLoading(){ clearInterval(timerInterval); clearInterval(stageInterval); loadingBox.style.display="none"; btnSubmit.disabled=false; }

// Submit
btnSubmit.addEventListener("click",submitDiagnosis);
queryInput.addEventListener("keydown",e=>{ if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)) submitDiagnosis(); });
async function submitDiagnosis(){
  const text=queryInput.value.trim();
  if(!text&&!selectedImageFile){ setStatus("Describe the problem, use the mic, or attach a photo.",true); queryInput.focus(); return; }
  setStatus(""); lastQuery=text||"Device problem shown in the attached photo"; lastRawText=text;
  let data=null;
  try{
    let res;
    if(selectedImageFile){
      showLoading(STAGES_IMAGE);
      const fd=new FormData(); fd.append("file",selectedImageFile); if(text) fd.append("query",text);
      res=await fetch(`${BACKEND_BASE}/v1/troubleshoot-image`,{method:"POST",body:fd});
    } else {
      showLoading(STAGES_TEXT);
      res=await fetch(`${BACKEND_BASE}/v1/troubleshoot`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:text})});
    }
    if(!res.ok) throw new Error(`Server returned HTTP ${res.status}: ${res.statusText}`);
    data=await res.json();
    renderResponse(data,parseCacheDecision(res.headers.get("X-Cache-Decision")));
  }catch(err){ console.error(err); renderError(err.message); }
  finally{ hideLoading(); }
  if(data) maybeClarify(data);
}

// Cache decision
function parseCacheDecision(h){
  const m=/^([a-z_]+)(?:; sim=([\d.]+))?(?:; matched=(.*))?$/.exec(h||""); if(!m) return null;
  let matched=m[3]||""; try{matched=decodeURIComponent(matched);}catch(e){}
  return {decision:m[1],simPct:Math.round(parseFloat(m[2]||"0")*100),matched};
}
function describeCache(cd){
  if(!cd) return null;
  if(cd.decision==="hit") return `Served from cache, matched "${cd.matched}" (${cd.simPct}%)`;
  if(cd.decision.startsWith("veto_")) return `Cache rejected: ${cd.simPct}% similar to "${cd.matched}" but ${cd.decision==="veto_polarity"?"means the opposite":"is about a different setting"}`;
  return null;
}

// Query understanding (mirrors backend enrich_query)
const FILLER=new Set(["um","umm","uh","uhh","like","basically","actually","kinda","sorta","so","well","just","hey","please","ok","okay"]);
const NORM={wifi:"wi-fi",wont:"won't",doesnt:"doesn't",isnt:"isn't",cant:"can't",dont:"don't",ur:"your",u:"you",pls:"please",plz:"please",thx:"thanks",tv:"TV"};
function enrich(raw){
  const out=[]; for(let w of (raw||"").trim().toLowerCase().replace(/[^\w\s'-]/g," ").split(/\s+/)){ if(!w) continue; w=NORM[w]||w; if(!FILLER.has(w)) out.push(w); }
  return out.join(" ").trim();
}
function renderFraming(raw){
  const el=$("queryFraming"), clean=enrich(raw);
  if(!raw||!clean||clean===raw.trim().toLowerCase()){ el.style.display="none"; return; }
  el.innerHTML=`<small>How Sentry read your description</small><div><span class="raw">"${esc(raw)}"</span><span class="arrow">becomes</span><span class="clean">${esc(clean)}</span></div>`;
  el.style.display="flex";
}

// Source + clarify badges (neutral on purpose: green/amber/red are reserved for actions)
function renderSource(meta,cd){
  const local=!!(meta&&meta.cache_hit)||(cd&&cd.decision==="hit");
  sourceBadgeWrap.innerHTML=`<span class="tag ${local?"on":""}">${local?"Matched on this device":"Verified in the cloud"}</span>`;
  const c=$("badgeCaption");
  c.textContent=local?"Cache matches stay on the device: no API call, no cost, no data sent.":"This query needed a live Gemini call to verify, not pattern matching alone.";
  c.style.display="block";
}
function extract(d){
  if(d.response&&Array.isArray(d.response.contexts)) return {contexts:d.response.contexts,fallback:d.response.fallback,message:d.response.message||d.message,meta:d.meta||{}};
  return {contexts:Array.isArray(d.contexts)?d.contexts:[],fallback:d.fallback,message:d.message,meta:d.meta||{}};
}
function clarifyBadge(state,gap){
  const t={na:"Single clear cause",ok:`Clarify check passed${gap?` (gap ${gap}%)`:""}`,asked:"Needs one more detail",error:"Clarify check unavailable"}[state];
  clarifyBadgeWrap.innerHTML=`<span class="tag ${state==="asked"?"on":""}">${t}</span>`;
}
async function maybeClarify(data){
  const {contexts,fallback}=extract(data);
  if(fallback||contexts.length<2){ clarifyBadge("na"); return; }
  const hyps=contexts.slice(0,2).map(c=>({title:c.title,score:c.score}));
  const gap=Math.round(Math.abs((hyps[0].score||0)-(hyps[1].score||0))*100);
  try{
    const r=await fetch(`${BACKEND_BASE}/v1/clarify`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:lastQuery,hypotheses:hyps,clarification_answer:null})});
    if(!r.ok){ clarifyBadge("error"); return; }
    const c=await r.json();
    if(c.needs_clarification&&c.question){ clarifyBadge("asked"); renderClarifyCard(c.question,hyps); } else clarifyBadge("ok",gap);
  }catch(e){ console.warn(e); clarifyBadge("error"); }
}
function renderClarifyCard(q,hyps){
  const [a,b]=hyps.map(h=>h.title);
  const chips=[a,b,"Both, or I'm not sure"].map(t=>`<button type="button" class="chip" data-answer="${esc(t)}">${esc(t)}</button>`).join("");
  resultsContainer.insertAdjacentHTML("afterbegin",`<div class="clarify" id="clarifyCard"><small>One question to narrow it down</small><h3>${esc(q)}</h3>
    <div class="chips">${chips}</div>
    <div class="free"><input type="text" class="text-input" id="clarifyText" placeholder="Or answer in your own words"><button type="button" class="btn-secondary" id="clarifySend">Send</button></div>
    <button type="button" class="btn-link" id="clarifySkip">Skip and keep these results</button></div>`);
  const card=$("clarifyCard");
  card.querySelectorAll(".chip").forEach(c=>c.addEventListener("click",()=>submitClarification(c.dataset.answer)));
  $("clarifySend").addEventListener("click",()=>{ const v=$("clarifyText").value.trim(); if(v) submitClarification(v); });
  $("clarifyText").addEventListener("keydown",e=>{ if(e.key==="Enter"){ const v=e.target.value.trim(); if(v) submitClarification(v); } });
  $("clarifySkip").addEventListener("click",()=>card.remove());
}
async function submitClarification(answer){
  try{
    showLoading(["Applying your answer","Re-ranking likely causes"]);
    const r=await fetch(`${BACKEND_BASE}/v1/clarify`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:lastQuery,hypotheses:window.__hyps||[],clarification_answer:answer})});
    if(!r.ok) throw new Error(`Server returned HTTP ${r.status}: ${r.statusText}`);
    renderResponse(await r.json());
    resultsContainer.insertAdjacentHTML("afterbegin",`<div class="refined">Results updated using your answer: "${esc(answer)}"</div>`);
  }catch(err){ console.error(err); renderError(err.message); }
  finally{ hideLoading(); }
}

function renderError(msg){
  telemetryBar.style.display="none";
  resultsContainer.innerHTML=`<div class="panel empty"><h3>Sentry couldn't reach the backend</h3><p>${esc(msg)}<br>Check that it is running at ${BACKEND_BASE}, for example with <code>python -m uvicorn main:app --port 8000</code>.</p></div>`;
}

// Area label inferred from the result's own text
const AREAS=[
  ["Battery",["battery","charge","charging","power","drain","overheat","heat"]],
  ["Camera",["camera","photo","picture","lens","flash","zoom","video","shutter"]],
  ["Display",["display","screen","brightness","dark mode","refresh","flicker","burn-in","navigation bar"]],
  ["Touch and gestures",["touch","gesture","swipe","tap","sensitivity","navigation"]],
  ["Sound",["sound","volume","speaker","audio","mic","ringtone","vibration"]],
  ["Connectivity",["wi-fi","wifi","bluetooth","network","connection","hotspot","signal","data","sim"]],
  ["Performance",["lag","freeze","slow","stutter","performance","memory","ram","storage"]],
  ["Security",["security","privacy","lock screen","biometric","fingerprint","face"]],
  ["Software",["update","firmware","reboot","restart","reset","safe mode"]],
];
function area(g){ const t=`${g.title||""} ${g.goal||""}`.toLowerCase(); for(const [n,w] of AREAS) if(w.some(x=>t.includes(x))) return n; return "General"; }
const KIND={auto:"Safe settings change",manual:"Needs your hands",critical:"Restart or reset"};

function trace(goal,i,contexts,meta,cd){
  const t=[],acts=Array.isArray(goal.actions)?goal.actions:[],pct=Math.round((goal.score||0)*100);
  t.push(`Matched the catalog at ${pct}% confidence`);
  if(goal.self_critique) t.push(`Self-critique: ${goal.self_critique}`);
  t.push(`Checked ${acts.length} action${acts.length===1?"":"s"}, in this order: ${acts.map(a=>KIND[(a.category||"manual").toLowerCase()]||"").join(", ")||"none"}`);
  let ok=0,auto=0,guard=0;
  acts.forEach(a=>(a.stepGroups||[]).forEach(sg=>{ if(sg&&sg.actionableDeeplink&&sg.actionableDeeplink.deeplink) ok++; else if(a.category==="auto") auto++; else guard++; }));
  t.push(auto>0?`Settings links: ${ok} verified, ${auto} settings action(s) without a link`:ok>0?`Settings links: ${ok} verified, none broken`:"Settings links: none needed, all steps are physical checks or restarts");
  const n=contexts.length; let r=`Ranked ${i+1} of ${n}`;
  if(n>1){ const o=contexts.map((c,j)=>j!==i&&c?Math.round((c.score||0)*100):null).filter(s=>s!==null); if(o.length) r+=` (this ${pct}%, other ${o.join("%, ")}%)`; }
  t.push(r);
  if(meta.cache_hit) t.push(`Served from semantic cache in ${meta.latency_ms??0} ms`);
  const c=describeCache(cd); if(c) t.push(c);
  return t;
}

function gauge(pct){
  const n=24,lit=Math.round(pct/100*n); let t="";
  for(let i=0;i<n;i++){ const a=(135+i*270/(n-1))*Math.PI/180,c=Math.cos(a),s=Math.sin(a);
    t+=`<line class="tick${i<lit?" on":""}" style="--i:${i}" x1="${(50+38.5*c).toFixed(1)}" y1="${(50+38.5*s).toFixed(1)}" x2="${(50+47.5*c).toFixed(1)}" y2="${(50+47.5*s).toFixed(1)}"/>`; }
  return `<div class="gauge" role="img" aria-label="Confidence ${pct} percent"><svg viewBox="0 0 100 100">${t}</svg><div class="gauge-num"><b>${pct}</b><span>confidence</span></div></div>`;
}
function renderResponse(data,cd=null){
  const {contexts,fallback,message,meta}=extract(data);
  window.__hyps=contexts.slice(0,2).map(c=>({title:c.title,score:c.score}));
  $("metaLatency").textContent=`${meta.latency_ms??0} ms`;
  $("metaModel").textContent=meta.model||"gemini-3.6-flash";
  $("metaCost").textContent=`$${(meta.cost_usd||0).toFixed(6)}`;
  const hit=!!meta.cache_hit; $("metaCache").textContent=hit?"Hit":"Miss";
  $("metaCacheNote").textContent=describeCache(cd)||"";
  renderSource(meta,cd); renderFraming(lastRawText);
  telemetryBar.style.display="flex";

  if(fallback==="vision_unavailable"){
    resultsContainer.innerHTML=`<div class="panel empty"><h3>Photo analysis is unavailable</h3><p>${esc(message||"Sentry couldn't analyze this image right now. Describe the problem in text instead.")}</p></div>`; return;
  }
  if(fallback==="service_busy"){
    resultsContainer.innerHTML=`<div class="panel empty"><h3>⏳ Service is busy</h3><p>The AI service is temporarily busy, please try again in a moment.</p></div>`; return;
  }
  if(fallback==="no_match"||fallback==="no_siis_context"||contexts.length===0){
    resultsContainer.innerHTML=`<div class="panel empty"><h3>No confident match in the catalog</h3><p>Try naming the symptom or setting, such as "swipe navigation", "battery drain", or "camera reset".</p></div>`; return;
  }
  let html="";
  contexts.forEach((goal,gi)=>{
    const pct=Math.round((goal.score||0)*100);
    const tr=trace(goal,gi,contexts,meta,cd).map(x=>`<li>${esc(x)}</li>`).join("");
    html+=`<article class="goal"><div class="goal-head">${gauge(pct)}<div>
      <div class="area">Hypothesis ${gi+1} of ${contexts.length}: ${esc(area(goal))}</div>
      <div class="goal-title">${esc(goal.title)}</div><div class="goal-text">${esc(goal.goal)}</div></div></div>
      <div class="verified">Verified via catalog retrieval, self-critique, and link validation, not a raw model guess.</div>
      <details class="trace"><summary>Why this diagnosis?</summary><ul>${tr}</ul></details><div class="actions">`;
    (goal.actions||[]).forEach(act=>{
      const cat=(act.category||"manual").toLowerCase();
      let steps="",dl=null;
      (act.stepGroups||[]).forEach(sg=>{ (sg.steps||[]).forEach(s=>steps+=`<li>${esc(s)}</li>`); if(sg.actionableDeeplink) dl=sg.actionableDeeplink; });
      const btn=dl?`<button type="button" class="deeplink" data-uri="${esc(dl.deeplink)}">Open in Settings <small>${esc(dl.deeplink)}</small></button>`:"";
      html+=`<div class="action cat-${cat}"><div class="act-head"><span class="act-name">${esc(act.actionName)}</span><span class="kind">${KIND[cat]||""}</span></div>
        <div class="act-desc">${esc(act.description)}</div><ol class="steps">${steps}</ol>${btn}</div>`;
    });
    html+=`</div></article>`;
  });
  resultsContainer.innerHTML=html;
}
resultsContainer.addEventListener("click",e=>{ const b=e.target.closest(".deeplink"); if(b) showToast(`Demo only. On a Galaxy this opens: ${b.dataset.uri}`); });
</script>
